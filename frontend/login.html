<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberReport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #050505, #0a192f, #1a0b2e, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .neon-border {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.15), inset 0 0 20px rgba(34, 211, 238, 0.05);
        }
    </style>
</head>
<body class="animated-bg text-white min-h-screen flex items-center justify-center font-sans overflow-hidden">

    <a href="index.html" class="fixed top-6 left-6 flex items-center gap-2 text-cyan-300 hover:text-white bg-black/40 hover:bg-black/60 px-4 py-2 rounded-xl transition-all duration-300 backdrop-blur-md border border-cyan-500/30 z-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span class="text-sm font-bold">Beranda</span>
    </a>

    <div class="bg-black/50 backdrop-blur-xl border border-cyan-500/30 p-8 rounded-2xl shadow-2xl w-full max-w-md text-white relative z-10 neon-border">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">CYBERREPORT</h1>
            <p class="text-cyan-200/70 mt-2 text-sm font-medium">Masuk ke sistem pelaporan</p>
        </div>

        <form id="loginForm">
            <div class="mb-5">
                <label class="block text-cyan-100 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" class="w-full px-4 py-3 bg-white/5 border border-cyan-500/30 rounded-lg text-white placeholder-cyan-800 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition" placeholder="email@contoh.com" required>
            </div>
            <div class="mb-8">
                <label class="block text-cyan-100 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 bg-white/5 border border-cyan-500/30 rounded-lg text-white placeholder-cyan-800 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition" placeholder="Masukkan password" required>
            </div>
            
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-lg transition duration-300 shadow-[0_0_15px_rgba(8,145,178,0.6)]">
                Masuk ke Sistem
            </button>
        </form>

        <p class="text-center text-cyan-200/60 mt-8 text-sm">
            Belum punya akun? <a href="register.html" class="text-cyan-400 font-bold hover:text-white transition">Daftar di sini</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;

                    try {
                        const response = await fetch('http://127.0.0.1:5000/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });
                        const data = await response.json();

                        if (response.ok) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                            alert('Login Berhasil!');
                            window.location.href = 'dashboard.html';
                        } else {
                            alert(data.message);
                        }
                    } catch (error) {
                        alert('Koneksi ke server gagal.');
                    }
                });
            }
        });
    </script>
</body>
</html>
