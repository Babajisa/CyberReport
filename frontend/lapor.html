<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - LaporAman</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200 mb-8">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-bold text-blue-900">LaporAman</span>
            <a href="dashboard.html" class="text-blue-600 font-medium hover:underline">&larr; Kembali</a>
        </div>
    </nav>

    <!-- Form -->
    <main class="max-w-3xl mx-auto px-4 pb-12">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Formulir Pelaporan Insiden</h1>

            <form id="laporForm">
                <!-- Kategori -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">Kategori Insiden</label>
                    <select id="kategori" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-white" required>
                        <option value="" disabled selected>-- Pilih Kategori --</option>
                        <option value="Penipuan Online">Penipuan Online (Scam)</option>
                        <option value="Phishing">Link Phishing</option>
                        <option value="Peretasan Akun">Peretasan Akun</option>
                        <option value="Sebar Data Pribadi">Penyebaran Data Pribadi</option>
                    </select>
                </div>

                <!-- Target Insiden -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">Nomor HP / Link Pelaku</label>
                    <input type="text" id="target_insiden" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" placeholder="Contoh: 0812345678" required>
                </div>

                <!-- LOKASI (BARU) -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">Lokasi Kejadian (Provinsi)</label>
                    <select id="lokasi" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-white" required>
                        <option value="" disabled selected>-- Pilih Provinsi --</option>
                        <option value="DKI Jakarta">DKI Jakarta</option>
                        <option value="Jawa Barat">Jawa Barat</option>
                        <option value="Jawa Tengah">Jawa Tengah</option>
                        <option value="Jawa Timur">Jawa Timur</option>
                        <option value="Sumatera Utara">Sumatera Utara</option>
                        <option value="Sulawesi Selatan">Sulawesi Selatan</option>
                        <option value="Bali">Bali</option>
                    </select>
                </div>

                <!-- Deskripsi -->
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Kronologi Kejadian</label>
                    <textarea id="deskripsi" rows="5" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" placeholder="Ceritakan detail kejadian..." required></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition">
                    Kirim Laporan
                </button>
            </form>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            
            // Tendang ke login kalau belum login
            if (!token) {
                alert('Anda harus login untuk membuat laporan!');
                window.location.href = 'login.html';
                return; 
            }

            const laporForm = document.getElementById('laporForm');

            if (laporForm) {
                laporForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    // 1. Ambil semua nilai dari form (Termasuk Lokasi)
                    const kategori = document.getElementById('kategori').value;
                    const target_insiden = document.getElementById('target_insiden').value;
                    const deskripsi = document.getElementById('deskripsi').value;
                    const lokasi = document.getElementById('lokasi').value; // <--- INI DITAMBAHKAN

                    try {
                        const response = await fetch('http://127.0.0.1:5000/api/laporan', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}` // Kirim Token
                            },
                            // 2. Kirim semua data ke backend (Termasuk Lokasi)
                            body: JSON.stringify({ kategori, target_insiden, deskripsi, lokasi }) // <--- LOKASI DITAMBAHKAN
                        });

                        const data = await response.json();

                        if (response.ok) {
                            alert(`✅ Laporan Berhasil!\n\nSimpan ID Tiket ini:\n${data.tiket_id}`);
                            window.location.href = 'dashboard.html'; 
                        } else {
                            alert(`❌ Gagal: ${data.message}`);
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('⚠️ Koneksi ke server gagal. Pastikan backend menyala.');
                    }
                });
            } else {
                console.error("Form laporForm tidak ditemukan!");
            }
        });
    </script>
</body>
</html>
